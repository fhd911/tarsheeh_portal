<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}بوابة الترشيح{% endblock %}</title>

  <style>
    :root{
      --bg:#f6f8fc;
      --card:#fff;
      --line:#e6edf5;
      --txt:#0f172a;
      --mut:#64748b;

      --brand:#0ea5a4;
      --ok:#16a34a;
      --bad:#ef4444;

      --r:12px;
      --ff: system-ui, "Cairo","Tajawal", Arial;
    }

    body{ margin:0; font-family:var(--ff); background:var(--bg); color:var(--txt); }
    a{ color:inherit; }

    .wrap{ max-width:1150px; margin:0 auto; padding:16px; }
    .top{
      background:#fff;
      border-bottom:1px solid var(--line);
      position:sticky; top:0; z-index:5;
    }

    .nav{
      display:flex; gap:12px;
      align-items:center; justify-content:space-between;
      padding:12px 16px;
      flex-wrap:wrap;
    }

    .brand{
      display:flex; flex-direction:column; gap:4px;
      min-width:240px;
    }

    .brand .title{
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      font-weight:900; text-decoration:none;
      line-height:1.1;
    }

    .brand .sub{
      color:var(--mut);
      font-size:12px;
      line-height:1.2;
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    }

    .pill{
      display:inline-flex; align-items:center;
      padding:3px 10px;
      border-radius:999px;
      font-size:12px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--txt);
      white-space:nowrap;
    }
    .pill.soft{ background:#f8fafc; }

    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:9px 12px;
      border-radius:10px;
      border:1px solid var(--line);
      background:#fff;
      text-decoration:none;
      gap:8px;
    }
    .btn.primary{ background:var(--brand); border-color:var(--brand); color:#fff; }

    .grid{ display:grid; gap:12px; }
    .cards{ display:grid; gap:10px; grid-template-columns:repeat(6,1fr); }
    .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px; }

    .k{ color:var(--mut); font-size:12px; }
    .v{ font-size:18px; font-weight:900; margin-top:4px; }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    input, select, textarea{
      padding:10px;
      border:1px solid var(--line);
      border-radius:10px;
      font-family:var(--ff);
      background:#fff;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      overflow:hidden;
    }
    th, td{ padding:10px; border-bottom:1px solid var(--line); text-align:right; font-size:13px; }
    th{ background:#f1f5f9; font-weight:900; }

    .tag{ padding:3px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); background:#fff; }
    .ok{ color:var(--ok); font-weight:900; }
    .bad{ color:var(--bad); font-weight:900; }
    .mut{ color:var(--mut); }

    .msg{
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px;
      margin:10px 0;
    }

    @media (max-width:900px){
      .cards{ grid-template-columns:repeat(2,1fr); }
      .brand{ min-width:auto; }
    }
  </style>
</head>

<body>

<div class="top">
  <div class="nav">

    <!-- Brand + subtitle -->
    <div class="brand">
      <a href="{% url 'tarsheeh:dashboard' %}" class="title">
        بوابة الترشيح
        <span class="pill soft">التشكيلات المدرسية (مدير/وكيل)</span>
      </a>

      <div class="sub">
        <!-- ✅ هنا لا نستخدم block title إطلاقًا -->
        <span class="pill">الصفحة: {% block page_name %}لوحة التحكم{% endblock %}</span>
      </div>
    </div>

    <!-- Main screens -->
    <div class="row">
      <a class="btn" href="{% url 'tarsheeh:applications' %}">شاشة العمليات</a>
      <a class="btn" href="{% url 'tarsheeh:scores' %}">شاشة المدخلات</a>
    </div>

    <!-- Actions -->
    <div class="row">
      <a class="btn" href="{% url 'tarsheeh:create_batch' %}">+ دفعة</a>
      <a class="btn" href="{% url 'tarsheeh:create_opportunity' %}">+ مدرسة/فرصة</a>
      <a class="btn primary" href="{% url 'tarsheeh:add_manual' %}">+ إدخال فردي</a>
      <a class="btn" href="{% url 'tarsheeh:paste_import' %}">لصق من Excel</a>
    </div>

  </div>
</div>

<div class="wrap">
  {% if messages %}
    {% for m in messages %}
      <div class="msg">{{ m }}</div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</div>

</body>
</html>
